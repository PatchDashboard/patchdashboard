<VirtualHost *:80>
    ServerName __SERVER_NAME__
    DocumentRoot __WEB_ROOT__

    <Directory __WEB_ROOT__>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    <Directory __API_ROOT__>
        Options -Indexes
        AllowOverride All
        Require all granted
    </Directory>

    RewriteEngine On

    RewriteRule ^/health$ __API_ROOT__/index.php [L]
    RewriteRule ^/api/ __API_ROOT__/index.php [L]

    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteRule ^ /index.html [L]

    ErrorLog __APACHE_LOG_DIR__/patchdashboard-error.log
    CustomLog __APACHE_LOG_DIR__/patchdashboard-access.log combined
</VirtualHost>
