server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;

    root __WEB_ROOT__;
    index index.html;

    client_max_body_size 32m;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        include fastcgi_params;
        fastcgi_pass unix:__PHP_FPM_SOCK__;
        fastcgi_param SCRIPT_FILENAME __API_ROOT__/index.php;
        fastcgi_param REQUEST_URI /health;
    }

    location ^~ /api/ {
        include fastcgi_params;
        fastcgi_pass unix:__PHP_FPM_SOCK__;
        fastcgi_param SCRIPT_FILENAME __API_ROOT__/index.php;
        fastcgi_param REQUEST_URI $request_uri;
    }
}
